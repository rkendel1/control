[package]
name = "control"
version = "0.1.0"
description = "Local Development Control Plane"
authors = ["Randy Kendel"]
edition = "2021"
rust-version = "1.75"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
regex = "1"
git2 = "0.19"
sysinfo = "0.30"
which = "6"
notify = "6"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
nix = { version = "0.27", features = ["process", "signal"] }
portable-pty = "0.9"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[lib]
name = "control"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
